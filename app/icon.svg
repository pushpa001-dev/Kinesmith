<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Kinesmith mark. Geometry only, no font dependency — the K is three
       shapes: stem, arm, leg. Arm and leg are true parallelograms sharing an
       edge at y=50, and both start at x=20 so they overlap the stem (16–31)
       rather than meeting it at a single point. Colours are --bg / --ember. -->
  <rect width="100" height="100" rx="22" fill="#070707"/>
  <path fill="#DFFF00" d="M16 20h15v60H16z M20 50 62 20h22L42 50z M20 50h22l42 30H62z"/>
</svg>
